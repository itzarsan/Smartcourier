<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Shipments - SmartShip</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { min-height: 100vh; background-color: #fff; box-shadow: 2px 0 10px rgba(0,0,0,0.05); }
        .sidebar .nav-link { color: #495057; font-weight: 500; padding: 12px 20px; border-radius: 8px; margin: 5px 15px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background-color: #e9ecef; color: #0d6efd; }
        .main-content { padding: 30px; }
        .table-custom { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .table-custom th { border-bottom: 2px solid #f8f9fa; background-color: #fff; color: #adb5bd; font-weight: 600; text-transform: uppercase; font-size: 0.8rem; padding: 15px; }
        .table-custom td { vertical-align: middle; padding: 15px; border-bottom: 1px solid #f8f9fa; }
        @media (max-width: 768px) { .sidebar { min-height: auto; padding-bottom: 20px; } .main-content { padding: 15px; } }
    </style>
</head>
<body>
<div class="container-fluid p-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 sidebar">
            <div class="p-4 text-center border-bottom">
                <a href="/" class="text-decoration-none text-dark">
                    <h4 class="fw-bold text-primary m-0"><i class="fas fa-shipping-fast me-2"></i>SmartShip</h4>
                </a>
            </div>
            <ul class="nav flex-column mt-4">
                <li class="nav-item"><a href="/customer/dashboard" class="nav-link"><i class="fas fa-home me-2 w-20"></i> Dashboard</a></li>
                <li class="nav-item"><a href="/customer/book" class="nav-link"><i class="fas fa-plus-circle me-2 w-20"></i> Book Courier</a></li>
                <li class="nav-item"><a href="/customer/history" class="nav-link active"><i class="fas fa-history me-2 w-20"></i> My Shipments</a></li>
                <li class="nav-item"><a href="/track" class="nav-link"><i class="fas fa-search-location me-2 w-20"></i> Track</a></li>
            
                <li class="nav-item mt-4">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="nav-link text-danger border-0 bg-transparent w-100 text-start fw-bold"><i class="fas fa-sign-out-alt me-2"></i> Logout</button>
                    </form>
                </li>
            </ul>
        </div>
        
        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 main-content bg-light min-vh-100">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold m-0">My Shipments</h3>
                <a href="/customer/book" class="btn btn-primary shadow-sm"><i class="fas fa-plus me-2"></i>New Booking</a>
            </div>
            
            <!-- Notifications -->
            <div th:if="${param.booked}" class="alert alert-success alert-dismissible fade show rounded-3 shadow-sm border-0 d-flex align-items-center" role="alert">
                <i class="fas fa-check-circle fa-2x me-3 text-success"></i>
                <div>
                    <strong>Booking Confirmed!</strong><br>
                    Your shipment has been booked successfully. Tracking ID: <span class="badge bg-dark fs-6 ms-1" th:text="${param.booked}"></span>
                </div>
                <button type="button" class="btn-close mt-2" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            
            <div class="table-custom table-responsive mt-4">
                <table class="table mb-0 table-hover">
                    <thead>
                        <tr>
                            <th>Tracking ID</th>
                            <th>Date booked</th>
                            <th>Receiver</th>
                            <th>Charge (₹)</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="b : ${bookings}">
                            <td><span class="fw-bold text-primary" th:text="${b.trackingId}"></span></td>
                            <td th:text="${#temporals.format(b.bookingDate, 'dd MMM yyyy, HH:mm')}"></td>
                            <td>
                                <div class="fw-bold text-dark" th:text="${b.receiverName}"></div>
                                <div class="small text-muted" style="max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"><i class="fas fa-map-marker-alt me-1"></i> <span th:text="${b.deliveryAddress}"></span></div>
                            </td>
                            <td class="fw-bold" th:text="${b.deliveryCharge}"></td>
                            <td>
                                <span th:class="'badge rounded-pill ' + (${b.status.name() == 'DELIVERED'} ? 'bg-success' : (${b.status.name() == 'FAILED'} ? 'bg-danger' : 'bg-primary'))" th:text="${b.status}"></span>
                            </td>
                            <td>
                                <a th:href="@{/track(trackingId=${b.trackingId})}" class="btn btn-sm btn-light border shadow-sm text-primary fw-bold px-3">
                                    <i class="fas fa-location-arrow me-1"></i> Track
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(bookings)}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="fas fa-box-open fa-3x mb-3 opacity-25"></i>
                                <h5>No shipments found</h5>
                                <p class="small">You haven't made any bookings yet.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
