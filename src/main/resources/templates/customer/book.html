<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Courier - SmartShip</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { min-height: 100vh; background-color: #fff; box-shadow: 2px 0 10px rgba(0,0,0,0.05); }
        .sidebar .nav-link { color: #495057; font-weight: 500; padding: 12px 20px; border-radius: 8px; margin: 5px 15px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background-color: #e9ecef; color: #0d6efd; }
        .main-content { padding: 30px; }
        .form-card { background: white; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: none; }
        .form-section-title { font-size: 1.1rem; font-weight: 600; color: #0d6efd; margin-bottom: 20px; border-bottom: 1px solid #e9ecef; padding-bottom: 10px; }
        .form-control, .form-select { border-radius: 8px; padding: 10px 15px; background-color: #f8f9fa; border: 1px solid #dee2e6; }
        .form-control:focus, .form-select:focus { background-color: #fff; box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1); border-color: #0d6efd; }
        @media (max-width: 768px) { .sidebar { min-height: auto; padding-bottom: 20px; } .main-content { padding: 15px; } }
    </style>
</head>
<body>
<div class="container-fluid p-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 sidebar">
            <div class="p-4 text-center border-bottom">
                <a href="/" class="text-decoration-none text-dark">
                    <h4 class="fw-bold text-primary m-0"><i class="fas fa-shipping-fast me-2"></i>SmartShip</h4>
                </a>
            </div>
            <ul class="nav flex-column mt-4">
                <li class="nav-item"><a href="/customer/dashboard" class="nav-link"><i class="fas fa-home me-2 w-20"></i> Dashboard</a></li>
                <li class="nav-item"><a href="/customer/book" class="nav-link active"><i class="fas fa-plus-circle me-2 w-20"></i> Book Courier</a></li>
                <li class="nav-item"><a href="/customer/history" class="nav-link"><i class="fas fa-history me-2 w-20"></i> My Shipments</a></li>
                <li class="nav-item"><a href="/track" class="nav-link"><i class="fas fa-search-location me-2 w-20"></i> Track</a></li>
            
                <li class="nav-item mt-4">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="nav-link text-danger border-0 bg-transparent w-100 text-start fw-bold"><i class="fas fa-sign-out-alt me-2"></i> Logout</button>
                    </form>
                </li>
            </ul>
        </div>
        
        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 main-content bg-light min-vh-100">
            <h3 class="fw-bold mb-4">Book a Courier</h3>
            
            <div class="row justify-content-center">
                <div class="col-xl-10">
                    <div class="card form-card p-4 p-md-5">
                        <form th:action="@{/customer/book}" th:object="${booking}" method="post">
                            
                            <div class="row">
                                <!-- Sender Details -->
                                <div class="col-md-6 mb-4">
                                    <div class="form-section-title"><i class="fas fa-user me-2"></i>Sender Details</div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-muted">Sender Name</label>
                                        <input type="text" th:field="*{senderName}" class="form-control" required/>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-muted">Phone Number</label>
                                        <input type="text" th:field="*{senderPhone}" class="form-control" required/>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-muted">Pickup Address</label>
                                        <textarea th:field="*{pickupAddress}" class="form-control" rows="3" required></textarea>
                                    </div>
                                </div>
                                
                                <!-- Receiver Details -->
                                <div class="col-md-6 mb-4">
                                    <div class="form-section-title"><i class="fas fa-user-tag me-2"></i>Receiver Details</div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-muted">Receiver Name</label>
                                        <input type="text" th:field="*{receiverName}" class="form-control" required/>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-muted">Phone Number</label>
                                        <input type="text" th:field="*{receiverPhone}" class="form-control" required/>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-muted">Delivery Address</label>
                                        <textarea th:field="*{deliveryAddress}" class="form-control" rows="3" required></textarea>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Parcel Details -->
                            <div class="form-section-title mt-2"><i class="fas fa-box me-2"></i>Parcel Information</div>
                            <div class="row">
                                <div class="col-md-12 mb-3">
                                    <label class="form-label small fw-bold text-muted">Parcel Description (Items inside)</label>
                                    <input type="text" th:field="*{packageDetails}" class="form-control" placeholder="E.g., Books, Electronics, Documents" required/>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label small fw-bold text-muted">Approximate Weight (kg)</label>
                                    <input type="number" step="0.1" min="0.1" th:field="*{packageWeight}" class="form-control" id="weight" oninput="calculateEstimate()" required/>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label small fw-bold text-muted">Delivery Type</label>
                                    <select th:field="*{deliveryType}" class="form-select" id="type" onchange="calculateEstimate()">
                                        <option value="Standard">Standard Delivery (3-5 days)</option>
                                        <option value="Express">Express Delivery (1-2 days)</option>
                                    </select>
                                </div>
                            </div>
                            
                            <!-- Charge Display -->
                            <div class="bg-primary bg-opacity-10 border border-primary rounded-3 p-4 text-center mt-4 mb-4">
                                <h6 class="text-primary mb-2 text-uppercase fw-bold">Estimated Delivery Charge</h6>
                                <h2 class="text-primary m-0 fw-bold">₹<span id="estimate">50.00</span></h2>
                                <p class="small text-muted m-0 mt-1">Base rate ₹50 + ₹10/kg (Express is 1.5x)</p>
                            </div>
                            
                            <div class="text-end mt-4">
                                <a href="/customer/dashboard" class="btn btn-light border px-4 me-2">Cancel</a>
                                <button type="submit" class="btn btn-primary px-5 shadow-sm fw-bold"><i class="fas fa-check-circle me-2"></i> Confirm Booking</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function calculateEstimate() {
        let weight = parseFloat(document.getElementById("weight").value) || 0;
        let type = document.getElementById("type").value;
        let base = 50.0;
        let weightCharge = weight * 10.0;
        let total = base + weightCharge;
        if(type === 'Express') total *= 1.5;
        document.getElementById("estimate").innerText = total.toFixed(2);
    }
</script>
</body>
</html>
