<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - SmartShip</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .auth-card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: none; }
        .form-control { border-radius: 8px; padding: 10px 15px; background-color: #f8f9fa; }
        .form-control:focus { background-color: #fff; box-shadow: none; border-color: #0d6efd; }
    </style>
</head>
<body class="py-5">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="text-center mb-4">
                <a href="/" class="text-decoration-none"><h2 class="text-primary fw-bold"><i class="fas fa-shipping-fast me-2"></i>SmartShip</h2></a>
            </div>
            <div class="card auth-card p-4 p-md-5">
                <h4 class="fw-bold mb-1">Create an Account</h4>
                <p class="text-muted small mb-4">Join us and manage your shipments seamlessly.</p>
                
                <form th:action="@{/register}" th:object="${user}" method="post">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold">Full Name</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="John Doe" required />
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold">Phone Number</label>
                            <input type="text" th:field="*{phone}" class="form-control" placeholder="+1 234 567 890" required />
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email Address</label>
                        <input type="email" th:field="*{email}" class="form-control" placeholder="john@example.com" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Delivery Address</label>
                        <textarea th:field="*{address}" class="form-control" rows="2" placeholder="123 Main St, City, Country" required></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Password</label>
                        <input type="password" th:field="*{password}" class="form-control" placeholder="Create a strong password" required />
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Create Account</button>
                    
                    <div class="text-center small mt-4">
                        <span class="text-muted">Already have an account?</span> <a href="/login" class="text-decoration-none fw-bold">Sign In</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
