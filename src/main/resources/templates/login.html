<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - SmartShip</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .auth-card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: none; overflow: hidden; }
        .auth-bg { background: linear-gradient(135deg, #0d6efd 0%, #0043a8 100%); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; }
        .form-control { border-radius: 8px; padding: 12px 15px; }
        .btn-primary { border-radius: 8px; padding: 12px; font-weight: 600; }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card auth-card flex-row h-100">
                <div class="col-md-5 d-none d-md-flex auth-bg text-center">
                    <i class="fas fa-shipping-fast fa-4x mb-3"></i>
                    <h3>SmartShip</h3>
                    <p class="small opacity-75 mt-2">Welcome back! Please login to access your dashboard and manage shipments.</p>
                </div>
                <div class="col-md-7 p-5">
                    <div class="text-center mb-4">
                        <a href="/" class="text-decoration-none text-dark d-md-none mb-3 d-block"><i class="fas fa-shipping-fast text-primary me-2"></i>SmartShip</a>
                        <h3 class="fw-bold">Sign In</h3>
                        <p class="text-muted">Enter your credentials to continue</p>
                    </div>
                    
                    <div th:if="${param.error}" class="alert alert-danger rounded-3 small">
                        <i class="fas fa-exclamation-circle me-2"></i> Invalid email or password.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success rounded-3 small">
                        <i class="fas fa-check-circle me-2"></i> You have been logged out.
                    </div>
                    <div th:if="${param.registered}" class="alert alert-success rounded-3 small">
                        <i class="fas fa-check-circle me-2"></i> Registration successful! Please login.
                    </div>
                    
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email" name="username" class="form-control border-start-0 bg-light" placeholder="name@example.com" required />
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" name="password" class="form-control border-start-0 bg-light" placeholder="********" required />
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mb-3 shadow-sm">Sign In <i class="fas fa-sign-in-alt ms-1"></i></button>
                        
                        <div class="text-center small mt-4">
                            <span class="text-muted">New to SmartShip?</span> <a href="/register" class="text-decoration-none fw-bold">Create an account</a>
                        </div>
                        <div class="text-center small mt-2">
                            <a href="/" class="text-decoration-none text-muted"><i class="fas fa-arrow-left me-1"></i> Back to Home</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
