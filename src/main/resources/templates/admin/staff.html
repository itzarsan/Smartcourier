<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Delivery Staff - SmartShip Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { min-height: 100vh; background-color: #212529; color: white; }
        .sidebar .nav-link { color: #adb5bd; font-weight: 500; padding: 12px 20px; border-radius: 8px; margin: 5px 15px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background-color: #0d6efd; color: white; }
        .main-content { padding: 30px; }
        .table-custom { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .table-custom th { border-bottom: 2px solid #f8f9fa; background-color: #fff; color: #adb5bd; font-weight: 600; text-transform: uppercase; font-size: 0.8rem; padding: 15px; }
        .table-custom td { vertical-align: middle; padding: 15px; border-bottom: 1px solid #f8f9fa; }
    </style>
</head>
<body>
<div class="container-fluid p-0">
    <div class="row g-0">
        <div class="col-md-3 col-lg-2 sidebar">
            <div class="p-4 text-center border-bottom border-secondary">
                <a href="/" class="text-decoration-none text-white">
                    <h5 class="fw-bold m-0"><i class="fas fa-shipping-fast me-2 text-primary"></i>SmartShip Admin</h5>
                </a>
            </div>
            <ul class="nav flex-column mt-4">
                <li class="nav-item"><a href="/admin/dashboard" class="nav-link"><i class="fas fa-chart-line me-2 w-20"></i> Dashboard</a></li>
                <li class="nav-item"><a href="/admin/bookings" class="nav-link"><i class="fas fa-boxes me-2 w-20"></i> Shipments</a></li>
                <li class="nav-item"><a href="/admin/customers" class="nav-link"><i class="fas fa-users me-2 w-20"></i> Customers</a></li>
                <li class="nav-item"><a href="/admin/staff" class="nav-link active"><i class="fas fa-user-shield me-2 w-20"></i> Delivery Staff</a></li>
            
                <li class="nav-item mt-4">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="nav-link text-danger border-0 bg-transparent w-100 text-start fw-bold"><i class="fas fa-sign-out-alt me-2"></i> Logout</button>
                    </form>
                </li>
            </ul>
        </div>
        <div class="col-md-9 col-lg-10 main-content bg-light min-vh-100">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold m-0">Delivery Staff Team</h3>
                <!-- In a real scenario, this button would open a modal to register a new staff -->
                <button class="btn btn-primary shadow-sm" onclick="alert('Staff creation would happen here')"><i class="fas fa-user-plus me-2"></i>Add Staff</button>
            </div>
            
            <div class="table-custom table-responsive">
                <table class="table mb-0 table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Agent Name</th>
                            <th>Email</th>
                            <th>Contact Phone</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${staffs}">
                            <td class="text-muted fw-bold" th:text="${'#' + s.id}"></td>
                            <td class="fw-bold"><i class="fas fa-motorcycle text-warning me-2"></i><span th:text="${s.name}"></span></td>
                            <td th:text="${s.email}"></td>
                            <td th:text="${s.phone}"></td>
                            <td><span class="badge bg-success rounded-pill">Active</span></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(staffs)}">
                            <td colspan="5" class="text-center py-5 text-muted">No delivery staff registered yet. Add staff to assign shipments.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
