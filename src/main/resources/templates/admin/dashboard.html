<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard - SmartShip</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { min-height: 100vh; background-color: #212529; color: white; }
        .sidebar .nav-link { color: #adb5bd; font-weight: 500; padding: 12px 20px; border-radius: 8px; margin: 5px 15px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background-color: #0d6efd; color: white; }
        .stat-card { border: none; border-radius: 12px; transition: transform 0.2s; background: white; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .icon-box { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .main-content { padding: 30px; }
        @media (max-width: 768px) { .sidebar { min-height: auto; padding-bottom: 20px; } .main-content { padding: 15px; } }
    </style>
</head>
<body>
<div class="container-fluid p-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 sidebar">
            <div class="p-4 text-center border-bottom border-secondary">
                <a href="/" class="text-decoration-none text-white">
                    <h5 class="fw-bold m-0"><i class="fas fa-shipping-fast me-2 text-primary"></i>SmartShip Admin</h5>
                </a>
            </div>
            <ul class="nav flex-column mt-4">
                <li class="nav-item"><a href="/admin/dashboard" class="nav-link active"><i class="fas fa-chart-line me-2 w-20"></i> Dashboard</a></li>
                <li class="nav-item"><a href="/admin/bookings" class="nav-link"><i class="fas fa-boxes me-2 w-20"></i> Shipments</a></li>
                <li class="nav-item"><a href="/admin/customers" class="nav-link"><i class="fas fa-users me-2 w-20"></i> Customers</a></li>
                <li class="nav-item"><a href="/admin/staff" class="nav-link"><i class="fas fa-user-shield me-2 w-20"></i> Delivery Staff</a></li>
            
                <li class="nav-item mt-4">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="nav-link text-danger border-0 bg-transparent w-100 text-start fw-bold"><i class="fas fa-sign-out-alt me-2"></i> Logout</button>
                    </form>
                </li>
            </ul>
            
        </div>
        
        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 main-content bg-light min-vh-100">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold m-0 text-dark">Admin Overview</h3>
            </div>

            <!-- Top Stats -->
            <div class="row g-4 mb-4">
                <div class="col-sm-6 col-xl-3">
                    <div class="card stat-card h-100 p-3">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="text-muted m-0 fw-bold text-uppercase small">Total Revenue</h6>
                            <div class="icon-box bg-success bg-opacity-10 text-success"><i class="fas fa-rupee-sign"></i></div>
                        </div>
                        <h3 class="fw-bold m-0" th:text="${totalRevenue}">0</h3>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="card stat-card h-100 p-3">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="text-muted m-0 fw-bold text-uppercase small">Total Shipments</h6>
                            <div class="icon-box bg-primary bg-opacity-10 text-primary"><i class="fas fa-box"></i></div>
                        </div>
                        <h3 class="fw-bold m-0" th:text="${totalBookings}">0</h3>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="card stat-card h-100 p-3">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="text-muted m-0 fw-bold text-uppercase small">Total Customers</h6>
                            <div class="icon-box bg-info bg-opacity-10 text-info"><i class="fas fa-users"></i></div>
                        </div>
                        <h3 class="fw-bold m-0" th:text="${totalCustomers}">0</h3>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="card stat-card h-100 p-3">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="text-muted m-0 fw-bold text-uppercase small">Delivery Staff</h6>
                            <div class="icon-box bg-warning bg-opacity-10 text-warning"><i class="fas fa-motorcycle"></i></div>
                        </div>
                        <h3 class="fw-bold m-0" th:text="${totalStaff}">0</h3>
                    </div>
                </div>
            </div>

            <!-- Shipment Status Row -->
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card stat-card h-100 p-4 border-start border-4 border-danger">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-hourglass-half fa-2x text-danger opacity-25 me-3"></i>
                            <div>
                                <h6 class="text-muted m-0">Pending (Booked)</h6>
                                <h4 class="fw-bold m-0 mt-1" th:text="${pendingBookings}">0</h4>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card stat-card h-100 p-4 border-start border-4 border-primary">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-truck-moving fa-2x text-primary opacity-25 me-3"></i>
                            <div>
                                <h6 class="text-muted m-0">Active (In Transit)</h6>
                                <h4 class="fw-bold m-0 mt-1" th:text="${activeBookings}">0</h4>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card stat-card h-100 p-4 border-start border-4 border-success">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-check-circle fa-2x text-success opacity-25 me-3"></i>
                            <div>
                                <h6 class="text-muted m-0">Successfully Delivered</h6>
                                <h4 class="fw-bold m-0 mt-1" th:text="${deliveredBookings}">0</h4>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
