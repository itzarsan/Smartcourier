<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Shipments - SmartShip Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { min-height: 100vh; background-color: #212529; color: white; }
        .sidebar .nav-link { color: #adb5bd; font-weight: 500; padding: 12px 20px; border-radius: 8px; margin: 5px 15px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background-color: #0d6efd; color: white; }
        .main-content { padding: 30px; }
        .table-custom { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .table-custom th { border-bottom: 2px solid #f8f9fa; background-color: #fff; color: #adb5bd; font-weight: 600; text-transform: uppercase; font-size: 0.8rem; padding: 15px; }
        .table-custom td { vertical-align: middle; padding: 15px; border-bottom: 1px solid #f8f9fa; }
        @media (max-width: 768px) { .sidebar { min-height: auto; padding-bottom: 20px; } .main-content { padding: 15px; } }
    </style>
</head>
<body>
<div class="container-fluid p-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 sidebar">
            <div class="p-4 text-center border-bottom border-secondary">
                <a href="/" class="text-decoration-none text-white">
                    <h5 class="fw-bold m-0"><i class="fas fa-shipping-fast me-2 text-primary"></i>SmartShip Admin</h5>
                </a>
            </div>
            <ul class="nav flex-column mt-4">
                <li class="nav-item"><a href="/admin/dashboard" class="nav-link"><i class="fas fa-chart-line me-2 w-20"></i> Dashboard</a></li>
                <li class="nav-item"><a href="/admin/bookings" class="nav-link active"><i class="fas fa-boxes me-2 w-20"></i> Shipments</a></li>
                <li class="nav-item"><a href="/admin/customers" class="nav-link"><i class="fas fa-users me-2 w-20"></i> Customers</a></li>
                <li class="nav-item"><a href="/admin/staff" class="nav-link"><i class="fas fa-user-shield me-2 w-20"></i> Delivery Staff</a></li>
            
                <li class="nav-item mt-4">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="nav-link text-danger border-0 bg-transparent w-100 text-start fw-bold"><i class="fas fa-sign-out-alt me-2"></i> Logout</button>
                    </form>
                </li>
            </ul>
        </div>
        
        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 main-content bg-light min-vh-100">
            <h3 class="fw-bold mb-4">Manage Shipments</h3>
            
            <div th:if="${param.assigned}" class="alert alert-success alert-dismissible fade show rounded-3 shadow-sm border-0 d-flex align-items-center">
                <i class="fas fa-check-circle fa-2x me-3 text-success"></i>
                <div>
                    <strong>Staff Assigned!</strong><br>Delivery staff successfully assigned to the shipment.
                </div>
                <button type="button" class="btn-close mt-1" data-bs-dismiss="alert"></button>
            </div>

            <div class="table-custom table-responsive">
                <table class="table mb-0 table-hover">
                    <thead>
                        <tr>
                            <th>Tracking ID</th>
                            <th>Date</th>
                            <th>Customer (Sender)</th>
                            <th>Receiver</th>
                            <th>Status</th>
                            <th>Assignment</th>
                            <th>Track</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="b : ${bookings}">
                            <td><span class="fw-bold text-primary" th:text="${b.trackingId}"></span></td>
                            <td class="small" th:text="${#temporals.format(b.bookingDate, 'dd MMM yyyy, HH:mm')}"></td>
                            <td class="fw-bold" th:text="${b.customer.name}"></td>
                            <td class="text-muted" th:text="${b.receiverName}"></td>
                            <td>
                                <span th:class="'badge rounded-pill ' + (${b.status.name() == 'DELIVERED'} ? 'bg-success' : (${b.status.name() == 'FAILED'} ? 'bg-danger' : 'bg-primary'))" th:text="${b.status}"></span>
                            </td>
                            <td>
                                <form th:action="@{/admin/assign}" method="post" class="d-flex" th:if="${b.status.name() == 'BOOKED' or b.status.name() == 'ASSIGNED' or b.status.name() == 'FAILED'}">
                                    <input type="hidden" name="bookingId" th:value="${b.id}" />
                                    <select name="staffId" class="form-select form-select-sm me-2 bg-light" required>
                                        <option value="">Select Staff...</option>
                                        <option th:each="s : ${staffs}" th:value="${s.id}" th:text="${s.name}"></option>
                                    </select>
                                    <button type="submit" class="btn btn-sm btn-success fw-bold">Assign</button>
                                </form>
                                <span th:unless="${b.status.name() == 'BOOKED' or b.status.name() == 'ASSIGNED' or b.status.name() == 'FAILED'}" class="text-muted small"><i class="fas fa-check me-1"></i> Locked</span>
                            </td>
                            <td><a th:href="@{/track(trackingId=${b.trackingId})}" target="_blank" class="btn btn-sm btn-outline-primary"><i class="fas fa-external-link-alt"></i></a></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(bookings)}">
                            <td colspan="7" class="text-center py-5 text-muted">No shipments found in the system.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
